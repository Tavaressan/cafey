org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
# Desligado: o cache local reaproveitou um resultado stale de lintAnalyzeDebug (o
# lint nao declara local.properties como input, entao uma mudanca nele nao invalida
# o cache) e reproduzia PropertyEscape mesmo apos o arquivo ser corrigido.
org.gradle.caching=false
org.gradle.workers.max=2
org.gradle.vfs.watch=false
# O link/otimizacao do executavel wasmJs processa o grafo inteiro do programa de uma
# vez. 1536m bastava enquanto App.kt era placeholder e o build local reaproveitava o
# estado incremental; com as telas em shared/ o link limpo do CI estourou a heap.
# 3g soma 5g com org.gradle.jvmargs=-Xmx2g e ainda cabe nos ~5.8GB livres do host,
# dado parallel=false e workers.max=2.
kotlin.daemon.jvmargs=-Xmx3g

kotlin.code.style=official
kotlin.mpp.stability.nowarn=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin/Wasm ainda é alvo experimental do Compose Multiplatform.
kotlin.wasm.experimental.compose=true
kotlin.incremental.wasm=true
