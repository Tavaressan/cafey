org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
# Desligado: o cache local reaproveitou um resultado stale de lintAnalyzeDebug (o
# lint nao declara local.properties como input, entao uma mudanca nele nao invalida
# o cache) e reproduzia PropertyEscape mesmo apos o arquivo ser corrigido.
org.gradle.caching=false
org.gradle.workers.max=2
org.gradle.vfs.watch=false
kotlin.daemon.jvmargs=-Xmx1g

kotlin.code.style=official
kotlin.mpp.stability.nowarn=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin/Wasm ainda é alvo experimental do Compose Multiplatform.
kotlin.wasm.experimental.compose=true
kotlin.incremental.wasm=true
