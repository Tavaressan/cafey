services:
  caddy:
    image: caddy:2-alpine
    container_name: cafey_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  app:
    # #158: remove o `build:` herdado de compose.yaml — em produção a imagem vem só do GHCR
    # (`image:` abaixo), nunca compilada na instância, mesmo que alguém rode `--build` por engano.
    build: !reset null
    image: ghcr.io/tavaressan/cafey-backend:latest
    restart: unless-stopped
    environment:
      # Ativa o profile prod (AWS IoT Core, INFRA-05) — sem essas variáveis no .env da
      # instância, o boot segue no profile default (MQTT desabilitado).
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      AWS_IOT_ENDPOINT: ${AWS_IOT_ENDPOINT:-}
      AWS_IOT_CERTIFICATE_PATH: ${AWS_IOT_CERTIFICATE_PATH:-}
      AWS_IOT_PRIVATE_KEY_PATH: ${AWS_IOT_PRIVATE_KEY_PATH:-}
      AWS_IOT_ROOT_CA_PATH: ${AWS_IOT_ROOT_CA_PATH:-}
      # Envio de e-mail de recuperação de senha via SMTP do AWS SES (issue #194). Sem host e
      # credenciais o boot segue normal, mas o envio falha de forma controlada (só log). Os
      # defaults de FROM/RESET_PASSWORD_URL/PORT espelham application(-prod).yml: variável vazia
      # propagada ao container anularia o default do Spring (placeholder resolve para "").
      CAFEY_MAIL_FROM: ${CAFEY_MAIL_FROM:-Cafey <nao-responda@cafey.local>}
      CAFEY_MAIL_RESET_PASSWORD_URL: ${CAFEY_MAIL_RESET_PASSWORD_URL:-http://localhost:8080/redefinir-senha.html}
      CAFEY_MAIL_SMTP_HOST: ${CAFEY_MAIL_SMTP_HOST:-}
      CAFEY_MAIL_SMTP_PORT: ${CAFEY_MAIL_SMTP_PORT:-587}
      CAFEY_MAIL_SMTP_USERNAME: ${CAFEY_MAIL_SMTP_USERNAME:-}
      CAFEY_MAIL_SMTP_PASSWORD: ${CAFEY_MAIL_SMTP_PASSWORD:-}
    volumes:
      # Certificados AWS IoT Core (INFRA-05) — arquivos reais ficam fora do repositório,
      # em /opt/cafey/secrets na instância (nunca commitados).
      - /opt/cafey/secrets:/run/secrets:ro

  db:
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
