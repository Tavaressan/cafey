services:
  caddy:
    image: caddy:2-alpine
    container_name: cafey_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  app:
    # #158: remove o `build:` herdado de compose.yaml — em produção a imagem vem só do GHCR
    # (`image:` abaixo), nunca compilada na instância, mesmo que alguém rode `--build` por engano.
    build: !reset null
    image: ghcr.io/tavaressan/cafey-backend:latest
    restart: unless-stopped
    environment:
      # Ativa o profile prod (AWS IoT Core, INFRA-05) — sem essas variáveis no .env da
      # instância, o boot segue no profile default (MQTT desabilitado).
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      AWS_IOT_ENDPOINT: ${AWS_IOT_ENDPOINT:-}
      AWS_IOT_CERTIFICATE_PATH: ${AWS_IOT_CERTIFICATE_PATH:-}
      AWS_IOT_PRIVATE_KEY_PATH: ${AWS_IOT_PRIVATE_KEY_PATH:-}
      AWS_IOT_ROOT_CA_PATH: ${AWS_IOT_ROOT_CA_PATH:-}
    volumes:
      # Certificados AWS IoT Core (INFRA-05) — arquivos reais ficam fora do repositório,
      # em /opt/cafey/secrets na instância (nunca commitados).
      - /opt/cafey/secrets:/run/secrets:ro

  db:
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
