services:
  caddy:
    image: caddy:2-alpine
    container_name: cafey_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  app:
    image: ghcr.io/tavaressan/cafey-backend:latest
    restart: unless-stopped
    volumes:
      # Certificados AWS IoT Core (INFRA-05) — arquivos reais ficam fora do repositório,
      # em /opt/cafey/secrets na instância (nunca commitados).
      - /opt/cafey/secrets:/run/secrets:ro

  db:
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
