services:
  caddy:
    image: caddy:2-alpine
    container_name: cafey_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  app:
    restart: unless-stopped

  db:
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
