services:
  db:
    image: postgres:16-alpine
    container_name: cafey_db
    environment:
      POSTGRES_USER: ${CAFEY_DB_USERNAME:-cafey_user}
      POSTGRES_PASSWORD: ${CAFEY_DB_PASSWORD:-cafey_password}
      POSTGRES_DB: ${CAFEY_DB_NAME:-cafey_db}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CAFEY_DB_USERNAME:-cafey_user} -d ${CAFEY_DB_NAME:-cafey_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build:
      context: ./cafey-backend
    container_name: cafey_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Sobrepõe a URL fixa de application.yml (localhost) para apontar ao host `db` da rede
      # interna do Compose — ver issue #149.
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${CAFEY_DB_NAME:-cafey_db}
      SPRING_DATASOURCE_USERNAME: ${CAFEY_DB_USERNAME:-cafey_user}
      SPRING_DATASOURCE_PASSWORD: ${CAFEY_DB_PASSWORD:-cafey_password}
      # Chaves RSA para assinatura dos JWT (cafey.jwt.*). Sem perfil `prod` ativo, a ausência
      # delas apenas gera um par efêmero (dev); nunca fica embutida na imagem.
      CAFEY_JWT_PRIVATE_KEY: ${CAFEY_JWT_PRIVATE_KEY:-}
      CAFEY_JWT_PUBLIC_KEY: ${CAFEY_JWT_PUBLIC_KEY:-}
      # Origem(ns) do app Web publicado autorizadas a chamar a API (padrão: dev server local).
      CAFEY_CORS_ALLOWED_ORIGINS: ${CAFEY_CORS_ALLOWED_ORIGINS:-http://localhost:8081}
    ports:
      - "8080:8080"

volumes:
  pgdata:
