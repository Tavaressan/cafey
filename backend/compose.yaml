services:
  db:
    image: postgres:16-alpine
    container_name: cafey_db
    environment:
      POSTGRES_USER: cafey_user
      POSTGRES_PASSWORD: cafey_password
      POSTGRES_DB: cafey_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafey_user -d cafey_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
