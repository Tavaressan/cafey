spring:
  application:
    name: cafey-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/cafey_db
    username: cafey_user
    password: cafey_password
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

cafey:
  cors:
    # Origens do app Web autorizadas a chamar a API (APP-08). Padrão: dev server do Kotlin/Wasm
    # (apps/webApp) em desenvolvimento local. Em produção, sobrescreva com o(s) domínio(s)
    # publicado(s) via CAFEY_CORS_ALLOWED_ORIGINS (lista separada por vírgula).
    allowed-origins: ${CAFEY_CORS_ALLOWED_ORIGINS:http://localhost:8081}
  jwt:
    private-key: ${CAFEY_JWT_PRIVATE_KEY:}
    public-key: ${CAFEY_JWT_PUBLIC_KEY:}
  rate-limit:
    enabled: true
    login-capacity: 5
    login-period-seconds: 60
    registrar-capacity: 10
    registrar-period-seconds: 60
    recuperar-senha-capacity: 5
    recuperar-senha-period-seconds: 60
