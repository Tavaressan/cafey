server:
  forward-headers-strategy: native

spring:
  application:
    name: cafey-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/cafey_db
    username: cafey_user
    password: cafey_password
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

cafey:
  mail:
    # Remetente e link de redefinição de senha usados por EmailSenderService (BE-23, #105).
    # Em produção, sobrescreva CAFEY_MAIL_FROM com um remetente verificado no AWS SES e
    # CAFEY_MAIL_RESET_PASSWORD_URL com a URL pública da página estática servida pelo próprio
    # backend (ex.: https://<domínio>/redefinir-senha.html). Credenciais SMTP: application-prod.yml.
    from: ${CAFEY_MAIL_FROM:Cafey <nao-responda@cafey.local>}
    reset-password-url: ${CAFEY_MAIL_RESET_PASSWORD_URL:http://localhost:8080/redefinir-senha.html}
  cors:
    # Origens do app Web autorizadas a chamar a API (APP-08). Padrão: dev server do Kotlin/Wasm
    # (apps/webApp) em desenvolvimento local. Em produção, sobrescreva com o(s) domínio(s)
    # publicado(s) via CAFEY_CORS_ALLOWED_ORIGINS (lista separada por vírgula).
    allowed-origins: ${CAFEY_CORS_ALLOWED_ORIGINS:http://localhost:8081}
  jwt:
    private-key: ${CAFEY_JWT_PRIVATE_KEY:}
    public-key: ${CAFEY_JWT_PUBLIC_KEY:}
  mfa:
    # Chave AES-256 (Base64, 32 bytes) para cifrar o segredo TOTP em repouso (issue #260).
    # Separada do par RSA de JWT. Obrigatória em prod; fora de prod, ausente = chave efêmera.
    encryption-key: ${CAFEY_MFA_ENCRYPTION_KEY:}
  rate-limit:
    enabled: true
    login-capacity: 5
    login-period-seconds: 60
    registrar-capacity: 10
    registrar-period-seconds: 60
    recuperar-senha-capacity: 5
    recuperar-senha-period-seconds: 60
  push:
    # Notificações push (épico #318). Sem credenciais o canal correspondente fica desligado e o boot
    # segue normal. Valores sensíveis só por variável de ambiente/arquivo montado (#367).
    offline-debounce-segundos: ${CAFEY_PUSH_OFFLINE_DEBOUNCE_SEGUNDOS:180}
    # Android (#362): caminho do JSON da conta de serviço do Firebase (nunca commitar o arquivo).
    fcm-credenciais-path: ${CAFEY_PUSH_FCM_CREDENTIALS_PATH:}
    # Web Push (#363): par VAPID em Base64URL e contato (mailto:) exigido pelos serviços de push.
    vapid-public-key: ${CAFEY_PUSH_VAPID_PUBLIC_KEY:}
    vapid-private-key: ${CAFEY_PUSH_VAPID_PRIVATE_KEY:}
    vapid-subject: ${CAFEY_PUSH_VAPID_SUBJECT:}
