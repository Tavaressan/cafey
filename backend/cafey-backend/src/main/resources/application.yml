spring:
  application:
    name: cafey-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/cafey_db
    username: cafey_user
    password: cafey_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
