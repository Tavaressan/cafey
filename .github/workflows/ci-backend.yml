name: CI Backend

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if backend exists
        id: check-backend
        run: |
          if [ -f "backend/cafey-backend/gradlew" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 21
        if: steps.check-backend.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        if: steps.check-backend.outputs.exists == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: backend/cafey-backend
          # PRs só leem o cache (dependências, wrapper e configuration cache)
          # gravado pelos pushes na branch default, evitando poluir o cache
          # com entradas de branches efêmeras e acelerando o feedback do PR.
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build and test backend
        if: steps.check-backend.outputs.exists == 'true'
        working-directory: backend/cafey-backend
        # `./gradlew test` também executa os testes de integração com
        # PostgreSQL real via Testcontainers (issue #102), que sobem um
        # container Docker em tempo de execução do teste — não durante a
        # fase de configuração do Gradle — por isso permanecem compatíveis
        # com o configuration cache habilitado em gradle.properties (#101).
        # Runners ubuntu-latest hospedados pelo GitHub já vêm com Docker
        # Engine disponível, sem necessidade de configuração adicional.
        run: |
          chmod +x gradlew
          ./gradlew test
